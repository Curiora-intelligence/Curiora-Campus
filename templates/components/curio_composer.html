<div class="curio-app" data-curio-app>
    <div class="curio-workspace">


        <section class="curio-conversation" data-curio-conversation aria-live="polite" aria-label="Curio conversation">
            <div class="curio-welcome">
                <h3>What are you curious about?</h3>
            </div>
        </section>

        <div class="curio-composer-area">
            <div class="curio-image-preview is-hidden" data-curio-preview-shell>
                <img data-curio-preview alt="Selected image for Curio to analyze">
                <div class="curio-image-preview-meta">
                    <span data-curio-filename>Image ready</span>
                    <button type="button" data-curio-remove-image aria-label="Remove selected image">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>

            <div class="curio-camera-inline is-hidden" data-curio-camera>
                <div class="curio-camera-toolbar">
                    <div>
                        <p id="curio-camera-title">Take a photo</p>
                        <span data-curio-camera-status>Requesting camera access…</span>
                    </div>
                    <button type="button" data-curio-close-camera aria-label="Close camera">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div class="curio-camera-view">
                    <video data-curio-video autoplay playsinline muted></video>
                </div>
                <div class="curio-camera-actions">
                    <button type="button" class="button button-secondary" data-curio-close-camera>Cancel</button>
                    <button type="button" class="button button-primary" data-curio-capture>Capture photo</button>
                </div>
            </div>

            <form class="curio-composer" data-curio-form>
                <input data-curio-file-input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

                <div class="curio-attachment-menu" data-curio-menu hidden>
                    <button type="button" data-curio-upload>
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.75 16.5V6.9c0-1.19.96-2.15 2.15-2.15h10.2c1.19 0 2.15.96 2.15 2.15v10.2c0 1.19-.96 2.15-2.15 2.15H8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="m7.5 15.25 2.45-2.45 2.15 2.15 1.8-1.8 3.35 3.35M15.7 9.2h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Upload image
                    </button>
                </div>

                <div class="curio-composer-row">
                    <button type="button" class="curio-icon-button" data-curio-menu-trigger aria-label="Add an image" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </button>

                    <label class="sr-only" for="curio-message">Ask Curio about an image</label>
                    <textarea id="curio-message" data-curio-message rows="1" maxlength="4000" placeholder="Ask Curio anything…"></textarea>

                    <button type="button" class="curio-icon-button curio-mic-button" data-curio-mic aria-label="Start voice input" aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8.5" y="3.5" width="7" height="11" rx="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    </button>

                    <button type="button" class="curio-icon-button curio-camera-button" data-curio-open-camera aria-label="Open camera">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.75 8.25c0-1.1.9-2 2-2h2.1l1.2-1.7h3.9l1.2 1.7h2.1c1.1 0 2 .9 2 2v8.5c0 1.1-.9 2-2 2H6.75c-1.1 0-2-.9-2-2v-8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.25" stroke="currentColor" stroke-width="1.7"/></svg>
                    </button>

                    <button type="submit" class="curio-send-button" data-curio-send aria-label="Send to Curio">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 18 0-12M7.5 10.5 12 6l4.5 4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </form>

            <div class="curio-guardrails">
                <span>Curio can make mistakes. Check important information.</span>
            </div>
        </div>
    </div>
</div>
