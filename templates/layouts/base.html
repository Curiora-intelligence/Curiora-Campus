<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Curiora Campus — thoughtful intelligence for modern universities.">
    <title>{% block title %}Curiora Campus{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/design-system.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', path='css/animations.css') }}?v=7">
    <link rel="stylesheet" href="{{ url_for('static', path='css/campus.css') }}?v=7">
    {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "components/navbar.html" %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    {% include "components/footer.html" %}

    <script src="{{ url_for('static', path='js/app.js') }}?v=7" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
