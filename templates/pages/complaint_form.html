{% extends "layouts/base.html" %}

{% block title %}Report an Issue — Curiora Campus{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-page-heading">
        <p class="eyebrow">CAMPUS SUPPORT</p>
        <h1>Tell us what needs attention.</h1>
        <p>Give the campus team enough context to begin triage quickly.</p>
    </div>

    <form class="campus-form" action="/submit-complaint" method="post">
        <label class="field-label" for="category">Issue category</label>
        <select id="category" name="category" required>
            {% for category in categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}
        </select>

        <label class="field-label" for="description">What happened?</label>
        <textarea id="description" name="description" rows="6" maxlength="2000" placeholder="Include the location, time, and details that will help the team respond." required></textarea>

        <button type="submit" class="button button-primary">Send report</button>
    </form>
</section>
{% endblock %}
