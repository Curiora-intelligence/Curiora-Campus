{% extends "layouts/base.html" %}

{% block title %}Faculty Access — Curiora Campus{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <p class="eyebrow">FACULTY PORTAL</p>
        <h1>Welcome back.</h1>
        <p>Sign in to review reports and feedback from your campus community.</p>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form class="campus-form compact" action="/faculty-portal" method="post">
            <label class="field-label" for="password">Faculty password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit" class="button button-primary">Open portal</button>
        </form>
    </div>
</section>
{% endblock %}
