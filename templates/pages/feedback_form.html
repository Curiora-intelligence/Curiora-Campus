{% extends "layouts/base.html" %}

{% block title %}Feedback — Curiora Campus{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-page-heading">
        <p class="eyebrow">STUDENT FEEDBACK</p>
        <h1>Help us make campus better.</h1>
        <p>Your feedback gives campus teams a clearer signal about what should improve next.</p>
    </div>

    <form class="campus-form" action="/submit-feedback" method="post">
        <label class="field-label" for="name">Name <span>Optional</span></label>
        <input id="name" type="text" name="name" maxlength="100" placeholder="How should we address you?">

        <label class="field-label" for="rating">Your experience</label>
        <select id="rating" name="rating" required>
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Good</option>
            <option value="3">3 — Okay</option>
            <option value="2">2 — Needs improvement</option>
            <option value="1">1 — Poor</option>
        </select>

        <label class="field-label" for="comment">Your feedback</label>
        <textarea id="comment" name="comment" rows="6" maxlength="2000" placeholder="Tell us what worked well or what should change." required></textarea>

        <button type="submit" class="button button-primary">Submit feedback</button>
    </form>
</section>
{% endblock %}
